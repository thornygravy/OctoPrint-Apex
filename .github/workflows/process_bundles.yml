name: "Process systeminfo bundles"

# Inherited from upstream OctoPrint. It relies on upstream's support bot
# (OctoPrint/actions@main, run with a write token), so it only runs when started by hand here.
on:
  workflow_dispatch:

jobs:
  process-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: OctoPrint/actions/process-systeminfo-bundles@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          comment: ${{ github.event.comment.id }}
          issue: ${{ github.event.issue.number }}
          body: ${{ github.event_name == 'issue_comment' && github.event.comment.body || github.event.issue.body }}
