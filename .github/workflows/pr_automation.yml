name: "Pull Request Automation"
# Inherited from upstream OctoPrint. It relies on upstream's PR validation rules,
# so it only runs when started by hand here.
on:
  workflow_dispatch:

jobs:
  pr-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

      - uses: OctoPrint/actions/pr-validation@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
